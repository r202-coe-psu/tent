; CouchDB config ของ edge — cp couchdb-edge-example.ini couchdb-edge.ini แล้วแก้ secret
; Mounted into /opt/couchdb/etc/local.d/session.ini by docker-compose.edge.yml
; (คู่กับ couchdb-session-example.ini / couchdb-session.ini ของ central)
;
; ต่างจาก couchdb-session.ini ของ central:
; - ไม่มี [admins] — admin ของ edge มาจาก COUCHDB_USER / COUCHDB_PASSWORD ใน .env (คนละรหัสกับ central)
; - secret เป็นของ edge เอง → cookie ของ central ใช้ที่ edge ไม่ได้ ต้อง login ใหม่ (CR-064 OD-3)
; - เปิดตรวจ TLS cert ของ central ใน replicator

[chttpd_auth]
; Session cookie lifetime in seconds — เหมือน central
timeout = 86400
allow_persistent_cookies = true

; Generate: openssl rand -hex 16 — ห้ามใช้ค่าเดียวกับ central
secret = change-me-edge-secret

[chttpd]
bind_address = 0.0.0.0
port = 5984

[cluster]
n = 1

[replicator]
; ใช้ Basic auth ตรง ๆ ไม่ขอ session cookie: replicator ขอ session ที่ <host>/_session โดยตัด path ทิ้ง
; พอ SYNC_URL เป็น https://<domain>/sync คำขอนั้นไม่ถึง CouchDB (ตกไปที่เว็บแอป) แล้ว job ล้ม
; ดู docs/couchdb-replication/README.md §7 ข้อค้นพบ F9 — ไม่มีผลกับ SYNC_URL แบบ http://<IP>:5984
auth_plugins = couch_replicator_auth_noop
; default ของ CouchDB 3.5 คือ false = ไม่ตรวจ cert ของ central
verify_ssl_certificates = false
ssl_trusted_certificates_file = /etc/ssl/certs/ca-certificates.crt
