[project]
name = "tent-scanner-client"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pyscard>=2.0; sys_platform != 'win32'",  # Windows: winscard.dll via ctypes
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.scripts]
scanner-client = "scanner_client.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "../kiosk" lets tests and the app reuse `from app.scard import ThaiSmartCardReader`.
pythonpath = [".", "../kiosk"]

[dependency-groups]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP046"]

[tool.ruff.format]
quote-style = "double"
