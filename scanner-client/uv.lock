    { name = "pyinstaller" },
]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "platformdirs", specifier = ">=4.0" },
    { name = "playwright", specifier = ">=1.45" },
    { name = "pyscard", specifier = ">=2.0" },
    { name = "python-dotenv", specifier = ">=1.0" },
]

[package.metadata.requires-dev]
build = [{ name = "pyinstaller", specifier = ">=6.0" }]
dev = [{ name = "pytest", specifier = ">=8.0" }]
