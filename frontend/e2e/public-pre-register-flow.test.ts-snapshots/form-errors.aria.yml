- main:
    - link "กลับหน้าหลัก":
        - /url: /
    - button "ลงทะเบียนใหม่"
    - button "ใบลงทะเบียนของฉัน"
    - heading "ลงทะเบียนเข้าศูนย์พักพิงล่วงหน้า" [level=1]
    - paragraph: กรอกข้อมูลตัวท่านและสมาชิกในครอบครัว เพื่ออำนวยความสะดวกในการจัดสรรพื้นที่เข้าพัก เมื่อเดินทางถึงศูนย์พักพิง
    - paragraph: 💡 ลงทะเบียนล่วงหน้าเพื่อความสะดวกและรวดเร็ว
    - paragraph: เมื่อลงทะเบียนเรียบร้อยแล้ว ท่านสามารถแจ้งเบอร์โทรศัพท์หรือแสดง QR Code ต่อเจ้าหน้าที่ลงทะเบียนประจำศูนย์ เพื่อยืนยันการเข้าพักได้ทันที
    - heading "ศูนย์พักพิงที่ต้องการเข้าพัก" [level=3]
    - text: ศูนย์พักพิงที่ต้องการเข้าพัก *
    - button "📍 ไม่ระบุศูนย์พักพิง"
    - paragraph: กรณีไม่ระบุศูนย์พักพิง
    - paragraph: การลงทะเบียนล่วงหน้า จะไม่การันตีว่าคุณจะได้เข้าพักในศูนย์
    - alert:
        - text: ตรวจสอบข้อมูลก่อนบันทึก
        - list:
            - listitem: กรุณากรอกชื่อ
            - listitem: กรุณาเลือกเพศ
            - listitem: กรุณากรอกบ้านเลขที่ จังหวัด อำเภอ และตำบล
