            - listitem:
                - button "ขั้นตอนที่ 1 ที่พักอาศัย"
            - listitem:
                - button "2 ขั้นตอนที่ 2 สมาชิก"
            - listitem:
                - button "3 ขั้นตอนที่ 3 สัตว์เลี้ยง"
