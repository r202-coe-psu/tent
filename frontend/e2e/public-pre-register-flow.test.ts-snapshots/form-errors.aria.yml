        - button "ไปยังช่องที่ต้องแก้"
    - complementary:
        - text: สรุปข้อมูลการลงทะเบียน Live Summary ศูนย์พักพิงเป้าหมาย
        - paragraph: ไม่ระบุศูนย์พักพิง
        - text: ที่พักอาศัย / ที่อยู่เดิม
        - button "แก้ไข"
        - paragraph: ยังไม่ได้ระบุที่อยู่
        - text: 'สมาชิกครอบครัว 1 คน ผู้ติดต่อหลัก: ยังไม่ได้ระบุชื่อ สัตว์เลี้ยง ไม่มี ทางลัดไปยังแต่ละส่วน'
        - button "1. ที่อยู่"
        - button "2. สมาชิก"
        - button "3. สัตว์เลี้ยง"
        - button "ยืนยันการลงทะเบียน"
