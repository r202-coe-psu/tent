<!doctype html>
<html lang="th-TH">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0A2647" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="manifest" href="/site.webmanifest" />
		<!--
			Zod v4 probes for eval with Function('') the first time a schema is built; the
			Content-Security-Policy (svelte.config.js kit.csp) forbids eval, so the probe logs a
			violation on every page. Zod reads this global when it loads, so it must be set before
			any app module runs — route matchers build schemas even before client hooks.
		-->
		<script nonce="%sveltekit.nonce%">
			globalThis.__zod_globalConfig = { jitless: true };
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
