services:
  couchdb:
    container_name: tent-couchdb-production
    image: couchdb:3.5
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - ../deployment/tent/data:/opt/couchdb/data
    # No port binding — reachable only inside Docker network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Creates system DBs (_users, _replicator, _global_changes). Idempotent.
  couchdb-init:
    container_name: tent-couchdb-init-production
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        CODE=$$(curl -s -o /tmp/couch-init.out -w '%{http_code}' -X POST \
          "http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@couchdb:5984/_cluster_setup" \
          -H "Content-Type: application/json" \
          -d "{\"action\":\"enable_single_node\",\"bind_address\":\"0.0.0.0\",\"username\":\"$${COUCHDB_USER}\",\"password\":\"$${COUCHDB_PASSWORD}\",\"port\":5984}")
        cat /tmp/couch-init.out || true
        case "$$CODE" in
          200|201) echo "CouchDB single-node setup OK" ;;
          400|409) echo "CouchDB already set up (HTTP $$CODE) — skipping" ;;
          *) echo "CouchDB cluster setup failed (HTTP $$CODE)"; exit 1 ;;
        esac

  mongodb:
    container_name: tent-mongodb-production
    image: mongo:7
    volumes:
      - ../deployment/tent/mongodb/data:/data/db
    # No port binding — reachable only inside Docker network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    container_name: tent-worker-production
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      couchdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      DATABASE_URI: ${DATABASE_URI:-mongodb://mongodb:27017/tentdb}
    restart: unless-stopped

  fastapi:
    container_name: tent-fastapi-production
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DATABASE_URI: ${DATABASE_URI:-mongodb://mongodb:27017/tentdb}
      SECRET_KEY: ${SECRET_KEY}
      EXTERNAL_API_SECRET: ${EXTERNAL_API_SECRET}
    # No port binding — reachable only inside Docker network (nginx proxies)
    restart: unless-stopped

  frontend:
    container_name: tent-frontend-production
    image: tent/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_APP_TITLE: ${PUBLIC_APP_TITLE:-Tent}
        PUBLIC_COUCHDB_URL: ${PUBLIC_ORIGIN:-http://localhost}
        PUBLIC_COUCH_PROXY: /couch
        PUBLIC_RECAPTCHA_SITE_KEY: ${PUBLIC_RECAPTCHA_SITE_KEY}
    environment:
      # adapter-node requires ORIGIN in production
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # Server-only — never bundled into the browser
      COUCHDB_ADMIN_URL: http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984
      # BFF donations/needs → FastAPI on the compose network (not localhost)
      FASTAPI_INTERNAL_URL: http://fastapi:9000
      EXTERNAL_API_SECRET: ${EXTERNAL_API_SECRET}
      # Site key also at runtime for $env/dynamic/public; secret is verify-only
      PUBLIC_RECAPTCHA_SITE_KEY: ${PUBLIC_RECAPTCHA_SITE_KEY}
      SECRET_RECAPTCHA_KEY: ${SECRET_RECAPTCHA_KEY}
    depends_on:
      couchdb:
        condition: service_healthy
      couchdb-init:
        condition: service_completed_successfully
      fastapi:
        condition: service_started
    restart: unless-stopped

  nginx:
    container_name: tent-nginx-production
    image: nginx:alpine
    ports:
      - "${NGINX_HOST:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - couchdb
      - fastapi
    restart: unless-stopped
