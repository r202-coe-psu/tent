# Edge nginx — mirror ของ nginx/nginx.conf ที่ root ยกเว้น public plane (CR-064 OD-1)

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Proxy /couch → CouchDB ของ edge (keeps session cookie same-origin)
    location /couch/ {
        proxy_pass http://couchdb:5984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://localhost/ /couch/;
    }

    # ไม่มี FastAPI ที่ edge — external consumers ใช้ได้เฉพาะ central
    location /external/ {
        default_type application/json;
        return 503 '{"error":"unavailable","reason":"edge-only mode: external API is served by central"}';
    }

    # Block internal worker routes (CR-126)
    location ^~ /api/internal/shelter-import/worker/ {
        return 404;
    }

    # Everything else → SvelteKit Node server
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}
