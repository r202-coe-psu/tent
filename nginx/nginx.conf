server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Proxy /couch → CouchDB (keeps session cookie same-origin)
    location /couch/ {
        proxy_pass http://couchdb:5984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://localhost/ /couch/;
    }

    # Central ⇄ edge replication (CR-064): the edge's _replicator jobs pull/push here
    # (SYNC_URL=https://<domain>/sync). Separate from /couch/ because replication needs larger
    # _bulk_docs batches, an unbuffered continuous _changes feed and long timeouts.
    location ^~ /sync/_utils {
        return 404;
    }
    location /sync/ {
        client_max_body_size 64M;
        proxy_pass http://couchdb:5984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Public plane: browser → SvelteKit `/api/public/v1/*` BFF → FastAPI with
    # EXTERNAL_API_SECRET (CR-063). No direct `/public-api` → FastAPI gateway.

    # External / machine consumers → FastAPI `/external/v1/*` + X-API-Key (CR-062).
    location /external/ {
        proxy_pass http://fastapi:9000/external/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block internal worker routes on public plane (CR-126)
    location ^~ /api/internal/shelter-import/worker/ {
        return 404;
    }

    # Everything else → SvelteKit Node server
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}
