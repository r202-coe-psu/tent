# CR-188 — per-IP rate limiting (server context). Needs ../rate-limit.conf at http level.
#
# Declared at server level so every location inherits it; a location that sets its own
# limit_req or error_page stops inheriting. Requests outside the limited paths have an
# empty key in every zone and are never counted (/couch/ included).

limit_req zone=tent_public_write burst=2000 nodelay;
limit_req zone=tent_public_read  burst=2000 nodelay;
limit_req zone=tent_auth         burst=2000 nodelay;
limit_req zone=tent_kiosk        burst=2000 nodelay;
limit_req zone=tent_external     burst=2000 nodelay;
limit_req_status 429;
limit_req_log_level warn;

error_page 429 = @tent_rate_limited;

location @tent_rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 429 $tent_rl_429_body;
}
