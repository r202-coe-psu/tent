# CR-188 — per-IP rate limiting at nginx (http context).
#
# The container nginx loads every top-level *.conf in this folder (mounted as conf.d).
# Host nginx: copy this file to /etc/nginx/conf.d/tent-rate-limit.conf, and the server
# snippet to /etc/nginx/snippets/tent-rate-limit.conf, then `include` the snippet inside
# the site's server block.
#
# Requires $remote_addr to be the real client IP (CR-188 §A). Behind a Cloudflare Tunnel
# that means realip with set_real_ip_from 127.0.0.1/::1 + real_ip_header CF-Connecting-IP;
# without it every request is 127.0.0.1 and the whole site shares one bucket.

# e2e runners and other trusted callers: an empty key is never counted (CR-188 FR-7).
geo $tent_rl_exempt {
    default 0;
    # 203.0.113.10 1;  # staging e2e runner
}

map $tent_rl_exempt $tent_rl_key {
    1       "";
    default $binary_remote_addr;
}

map $uri $tent_rl_class {
    ~^/api/public/v1/               public;
    ~^/api/v1/auth/                 auth;
    ~^/api/v1/thirdparty-clients/   auth;
    ~^/api/v1/kiosk/                kiosk;
    ~^/api/v1/scanner/              kiosk;
    ~^/external/                    external;
    default                         "";
}

map "$tent_rl_class:$request_method" $tent_rl_public_write_key {
    ~^public:(POST|PUT|PATCH|DELETE)$ $tent_rl_key;
    default                           "";
}

map "$tent_rl_class:$request_method" $tent_rl_public_read_key {
    ~^public:(POST|PUT|PATCH|DELETE)$ "";
    ~^public:                         $tent_rl_key;
    default                           "";
}

map $tent_rl_class $tent_rl_auth_key {
    auth    $tent_rl_key;
    default "";
}

map $tent_rl_class $tent_rl_kiosk_key {
    kiosk   $tent_rl_key;
    default "";
}

map $tent_rl_class $tent_rl_external_key {
    external $tent_rl_key;
    default  "";
}

# One ceiling for every zone (owner decision 2026-10-23, CR-188): 10000 req/min per IP.
# A shelter's Wi-Fi or a Thai mobile carrier's CGNAT puts hundreds of people behind one
# IPv4, so this caps floods, not individual people.
limit_req_zone $tent_rl_public_write_key zone=tent_public_write:10m rate=10000r/m;
limit_req_zone $tent_rl_public_read_key  zone=tent_public_read:10m  rate=10000r/m;
limit_req_zone $tent_rl_auth_key         zone=tent_auth:10m         rate=10000r/m;
limit_req_zone $tent_rl_kiosk_key        zone=tent_kiosk:10m        rate=10000r/m;
limit_req_zone $tent_rl_external_key     zone=tent_external:10m     rate=10000r/m;

# 429 bodies match what each client already parses (CR-188 §B).
map $tent_rl_class $tent_rl_429_body {
    kiosk    '{"error":{"code":"KIOSK_RATE_LIMITED","message":"กรุณารอสักครู่แล้วลองใหม่"}}';
    external '{"errors":[{"error":{"code":"RATE_LIMITED","message":"Too many requests"}}]}';
    default  '{"success":false,"error":"RATE_LIMITED","message":"Too many requests"}';
}
