# Central ⇄ edge CouchDB replication (CR-064) — compose-nginx variant only
# (docker-compose.{staging,production}.yml). Jenkins deploys the *.no-nginx.yml stacks, where the
# host nginx proxies `sync.<domain>` straight to 127.0.0.1:5984 instead — see README "Edge @ศูนย์".
#
# Edge servers replicate against `https://sync.<domain>`, never the app domain: during a WAN outage
# the shelter LAN DNS points the app domain at the edge itself, so replicating through it would loop.
# Loaded after nginx.conf (alphabetical), so the app server block stays the default for :80.

server {
    listen 80;
    server_name ~^sync\.;

    # Replicator _bulk_docs batches (worker_batch_size 500) — the app block allows only 10M
    client_max_body_size 64M;

    # Replication never needs Fauxton
    location /_utils {
        return 404;
    }

    location / {
        proxy_pass http://couchdb:5984;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Continuous _changes must stream through unbuffered
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
