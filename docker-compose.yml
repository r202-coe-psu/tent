services:
  couchdb:
    container_name: couchdb
    image: couchdb:3.5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
    ports:
      - "5984:5984"
    volumes:
      - ../deployment/tent/couchdb/data:/opt/couchdb/data
      - ./couchdb-session.ini:/opt/couchdb/etc/local.d/session.ini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        CODE=$$(curl -s -o /tmp/couch-init.out -w '%{http_code}' -X POST \
          "http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@couchdb:5984/_cluster_setup" \
          -H "Content-Type: application/json" \
          -d "{\"action\":\"enable_single_node\",\"bind_address\":\"0.0.0.0\",\"username\":\"$${COUCHDB_USER}\",\"password\":\"$${COUCHDB_PASSWORD}\",\"port\":5984}")
        cat /tmp/couch-init.out || true
        case "$$CODE" in
          200|201) echo "CouchDB single-node setup OK" ;;
          400) echo "CouchDB already set up (HTTP 400) — skipping" ;;
          *) echo "CouchDB cluster setup failed (HTTP $$CODE)"; exit 1 ;;
        esac

  mongodb:
    container_name: tent-mongodb
    image: mongo:8.0
    # Dev only — no auth; do not expose host port in production (staging uses internal network).
    # Workaround: kernel ≥6.19 + MongoDB 8 TCMalloc rseq crash (exit 139).
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - ../deployment/tent/mongodb/data:/data/db
    healthcheck:
      # mongosh is a ~150 MB Node process per probe; stalled probes piled up to 4.5 GB and
      # caused the 2026-11-08 staging OOM. A TCP connect costs a few MB.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: sync-worker
    depends_on:
      couchdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
      DATABASE_URI: ${DATABASE_URI:-mongodb://mongodb:27017/tentdb}
      # M5 referral sync tick (draft CR — referral M5 §1): worker → FastAPI only.
      FASTAPI_INTERNAL_URL: http://fastapi:9000
      EXTERNAL_API_SECRET: ${EXTERNAL_API_SECRET:-dev-external-secret}
      M5_SYNC_INTERVAL_S: ${M5_SYNC_INTERVAL_S:-45}
      M6_SYNC_INTERVAL_S: ${M6_SYNC_INTERVAL_S:-45}
      # Print housekeeping task (CR-222 FR-17) — dev opt-in: set DEV_PRINT_HOUSEKEEPING_TOKEN to the
      # PRINT_HOUSEKEEPING_TOKEN in frontend/.env. Not PRINT_HOUSEKEEPING_TOKEN: the root .env
      # carries a staging placeholder that would switch the task on against a token-less pnpm dev.
      PRINT_HOUSEKEEPING_URL: ${PRINT_HOUSEKEEPING_URL:-http://host.docker.internal:5173}
      PRINT_HOUSEKEEPING_TOKEN: ${DEV_PRINT_HOUSEKEEPING_TOKEN:-}
      PRINT_HOUSEKEEPING_INTERVAL_MS: ${PRINT_HOUSEKEEPING_INTERVAL_MS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  edge-users-copy:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: edge-users-copy
    command: ["uv", "run", "--project", "worker", "edge-users-copy"]
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
    mem_limit: 256m
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tent-fastapi
    depends_on:
      mongodb:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URI: ${DATABASE_URI:-mongodb://mongodb:27017/tentdb}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      EXTERNAL_API_SECRET: ${EXTERNAL_API_SECRET:-dev-external-secret}
      M5_BASE_URL: ${M5_BASE_URL:-}
      M5_CLIENT_ID: ${M5_CLIENT_ID:-}
      M5_CLIENT_SECRET: ${M5_CLIENT_SECRET:-}
      M6_BASE_URL: ${M6_BASE_URL:-}
      M6_CLIENT_ID: ${M6_CLIENT_ID:-}
      M6_CLIENT_SECRET: ${M6_CLIENT_SECRET:-}
      THIRDPARTY_JWT_SIGNING_KEY: ${THIRDPARTY_JWT_SIGNING_KEY:-dev-thirdparty-jwt-signing-key}
      THIRDPARTY_SECRET_SALT: ${THIRDPARTY_SECRET_SALT:-salt-change-this-on-prod}
      COUCHDB_URL: ${COUCHDB_URL:-http://couchdb:5984}
    ports:
      - "9000:9000"
    volumes:
      - ./backend/apiapp:/app/backend/apiapp
    restart: unless-stopped

  import-worker:
    image: tent/frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      SHELTER_IMPORT_WORKER_URL: ${SHELTER_IMPORT_WORKER_URL:-http://host.docker.internal:5173}
      SHELTER_IMPORT_WORKER_TOKEN: ${SHELTER_IMPORT_WORKER_TOKEN:?SHELTER_IMPORT_WORKER_TOKEN is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["pnpm", "import-worker"]
    healthcheck:
      disable: true
    restart: unless-stopped

networks:
  default:
