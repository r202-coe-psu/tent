[project]
name = "scanner-client"
version = "0.1.0"
description = "Smart Card Scanner Client for SmartShelter (Tent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyscard>=2.2.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
