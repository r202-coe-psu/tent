# Edge appliance at a shelter (CR-064 OD-1): CouchDB + nginx `/couch` + staff SPA (Node).
# No FastAPI / MongoDB / sync worker / import worker — the public plane lives on central only.
# Derived from docker-compose.production.yml; per-service rationale: docs/couchdb-replication/SETUP-EDGE.md
#
# On the edge server (clone this repo), fill in the copied files, then:
#   cp .env.edge.example .env && cp couchdb-edge-example.ini couchdb-edge.ini
#   docker compose -f docker-compose.edge.yml up -d

name: tent-edge

# Env shared by the services that (re)create the replication jobs: edge-init and edge-watchdog
x-edge-job-env: &edge-job-env
  COUCHDB_USER: ${COUCHDB_USER}
  COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
  SHELTER_CODE: ${SHELTER_CODE:?SHELTER_CODE is required}
  SYNC_URL: ${SYNC_URL:?SYNC_URL is required}
  # Central CouchDB admin — used by every replication job, including the filtered _users pull
  CENTRAL_REPL_USER: ${CENTRAL_REPL_USER:?CENTRAL_REPL_USER is required}
  CENTRAL_REPL_PASSWORD: ${CENTRAL_REPL_PASSWORD:?CENTRAL_REPL_PASSWORD is required}

services:
  couchdb:
    container_name: tent-couchdb-edge
    # Must match central — edge verifies passwords against the replicated _users hashes
    image: couchdb:3.5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?COUCHDB_USER is required}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required}
    volumes:
      - ${EDGE_COUCHDB_DATA:-../deployment/tent-edge/couchdb/data}:/opt/couchdb/data
      # Edge's own secret + replicator TLS — never reuse central's couchdb-session.ini
      - ./couchdb-edge.ini:/opt/couchdb/etc/local.d/session.ini
    # Loopback only, for admin/debug from the edge server shell — staff go through nginx /couch
    ports:
      - "127.0.0.1:${EDGE_COUCHDB_PORT:-5984}:5984"
    # POC T9: simulate the LAN DNS cutover of the app domain to this edge
    # extra_hosts:
    #   - "app.example.com:${EDGE_LAN_IP}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Creates system DBs (_users, _replicator, _global_changes). Idempotent.
  couchdb-init:
    container_name: tent-couchdb-init-edge
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        CODE=$$(curl -s -o /tmp/couch-init.out -w '%{http_code}' -X POST \
          "http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@couchdb:5984/_cluster_setup" \
          -H "Content-Type: application/json" \
          -d "{\"action\":\"enable_single_node\",\"bind_address\":\"0.0.0.0\",\"username\":\"$${COUCHDB_USER}\",\"password\":\"$${COUCHDB_PASSWORD}\",\"port\":5984}")
        cat /tmp/couch-init.out || true
        case "$$CODE" in
          200|201) echo "CouchDB single-node setup OK" ;;
          400|409) echo "CouchDB already set up (HTTP $$CODE) — skipping" ;;
          *) echo "CouchDB cluster setup failed (HTTP $$CODE)"; exit 1 ;;
        esac

  # Shelter DB + _security + read-only guard + _replicator jobs (scripts/edge-init.sh). Idempotent.
  edge-init:
    container_name: tent-edge-init-edge
    image: curlimages/curl:latest
    depends_on:
      couchdb-init:
        condition: service_completed_successfully
    environment: *edge-job-env
    volumes:
      - ./scripts/edge-init.sh:/edge-init.sh:ro
    entrypoint: ["sh", "/edge-init.sh"]
    restart: "no"

  # Restarts replication jobs that CouchDB left in exponential backoff after a WAN/central outage
  # (scripts/edge-watchdog.sh). Skips auth errors and waits for central's /_up before touching anything.
  edge-watchdog:
    container_name: tent-edge-watchdog-edge
    image: curlimages/curl:latest
    depends_on:
      edge-init:
        condition: service_completed_successfully
    environment:
      <<: *edge-job-env
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-60}
      WATCHDOG_MIN_ERRORS: ${WATCHDOG_MIN_ERRORS:-3}
      WATCHDOG_COOLDOWN: ${WATCHDOG_COOLDOWN:-300}
      WATCHDOG_DRY_RUN: ${WATCHDOG_DRY_RUN:-0}
    volumes:
      - ./scripts/edge-init.sh:/edge-init.sh:ro
      - ./scripts/edge-watchdog.sh:/edge-watchdog.sh:ro
    entrypoint: ["sh", "/edge-watchdog.sh"]
    restart: unless-stopped

  frontend:
    container_name: tent-frontend-edge
    image: ${FRONTEND_IMAGE:-tent/frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_APP_TITLE: ${PUBLIC_APP_TITLE:-Tent}
        # Same domain as central — cutover happens at DNS (CR-064 OD-2)
        PUBLIC_COUCHDB_URL: ${PUBLIC_ORIGIN:-http://localhost}
        PUBLIC_COUCH_PROXY: /couch
        PUBLIC_RECAPTCHA_SITE_KEY: ${PUBLIC_RECAPTCHA_SITE_KEY:-}
    environment:
      # adapter-node requires ORIGIN in production
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # node:cluster workers for BFF/SPA (clamped to CPUs)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Server-only — never bundled into the browser; points at this edge's CouchDB
      COUCHDB_ADMIN_URL: http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984
      # No FASTAPI_INTERNAL_URL / EXTERNAL_API_SECRET / COUCHDB_PUBLIC_WRITER_URL /
      # SHELTER_IMPORT_WORKER_TOKEN / OAuth — public plane, import and step-up MFA belong to central
      # (those routes fail when called, which is the CR-064 degraded mode)
    depends_on:
      couchdb:
        condition: service_healthy
      couchdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  nginx:
    container_name: tent-nginx-edge
    image: nginx:alpine
    # Server B's LAN IP — never expose to the WAN
    ports:
      - "${EDGE_LAN_IP:-127.0.0.1}:${EDGE_HTTP_PORT:-80}:80"
    # Separate from ./nginx: nginx.conf proxies /external/ → fastapi, which edge lacks (nginx won't start)
    volumes:
      - ./nginx-edge:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - couchdb
    restart: unless-stopped
