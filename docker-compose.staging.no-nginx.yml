services:
  couchdb:
    container_name: tent-couchdb-staging
    image: couchdb:3.5
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /mnt/tent-data/couchdb/data:/opt/couchdb/data
      - ./couchdb-session.ini:/opt/couchdb/etc/local.d/session.ini
    ports:
      - "${COUCHDB_BIND_IP:-127.0.0.1}:${COUCHDB_PORT:-5984}:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Creates system DBs (_users, _replicator, _global_changes). Idempotent.
  couchdb-init:
    container_name: tent-couchdb-init-staging
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        CODE=$$(curl -s -o /tmp/couch-init.out -w '%{http_code}' -X POST \
          "http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@couchdb:5984/_cluster_setup" \
          -H "Content-Type: application/json" \
          -d "{\"action\":\"enable_single_node\",\"bind_address\":\"0.0.0.0\",\"username\":\"$${COUCHDB_USER}\",\"password\":\"$${COUCHDB_PASSWORD}\",\"port\":5984}")
        cat /tmp/couch-init.out || true
        case "$$CODE" in
          200|201) echo "CouchDB single-node setup OK" ;;
          400|409) echo "CouchDB already set up (HTTP $$CODE) — skipping" ;;
          *) echo "CouchDB cluster setup failed (HTTP $$CODE)"; exit 1 ;;
        esac

  mongodb:
    container_name: tent-mongodb-staging
    image: mongo:7
    volumes:
      - /mnt/tent-data/mongodb/data:/data/db
    # No host port — internal Docker network only
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    container_name: tent-worker-staging
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      couchdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      DATABASE_URI: ${DATABASE_URI:-mongodb://mongodb:27017/tentdb}
    restart: unless-stopped

  fastapi:
    container_name: tent-fastapi-staging
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Host-only bind — donation routes require EXTERNAL_API_SECRET (BFF); do not
    # publish 0.0.0.0 or captcha on the SvelteKit BFF is bypassable.
    ports:
      - "${FASTAPI_BIND_IP:-127.0.0.1}:${FASTAPI_PORT:-9000}:9000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DATABASE_URI: ${DATABASE_URI:-mongodb://mongodb:27017/tentdb}
      SECRET_KEY: ${SECRET_KEY}
      EXTERNAL_API_SECRET: ${EXTERNAL_API_SECRET}
      THIRDPARTY_JWT_SIGNING_KEY: ${THIRDPARTY_JWT_SIGNING_KEY}
      COUCHDB_URL: ${COUCHDB_URL:-http://couchdb:5984}
    restart: unless-stopped

  frontend:
    container_name: tent-frontend-staging
    image: tent/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_APP_TITLE: ${PUBLIC_APP_TITLE:-Tent}
        PUBLIC_COUCHDB_URL: ${PUBLIC_ORIGIN:-http://localhost}
        PUBLIC_COUCH_PROXY: /couch
        PUBLIC_RECAPTCHA_SITE_KEY: ${PUBLIC_RECAPTCHA_SITE_KEY}
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      # adapter-node requires ORIGIN in production
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # node:cluster workers for BFF/SPA (clamped to CPUs); see .env.example scale map
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Server-only — never bundled into the browser
      COUCHDB_ADMIN_URL: http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984
      # Roleless writer for anonymous public writes (CR-070 booking, CR-052
      # courier PATCH). putAsPublicWriter fails closed without it outside dev.
      COUCHDB_PUBLIC_WRITER_URL: http://${COUCHDB_PUBLIC_WRITER_USER:-public_writer}:${COUCHDB_PUBLIC_WRITER_PASSWORD}@couchdb:5984
      # BFF donations/needs → FastAPI on the compose network (not localhost)
      FASTAPI_INTERNAL_URL: http://fastapi:9000
      EXTERNAL_API_SECRET: ${EXTERNAL_API_SECRET}
      # Site key also at runtime for $env/dynamic/public; secret is verify-only
      PUBLIC_RECAPTCHA_SITE_KEY: ${PUBLIC_RECAPTCHA_SITE_KEY}
      RECAPTCHA_PROJECT_ID: ${RECAPTCHA_PROJECT_ID:-smart-shelter-508719}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-recaptcha-key.json
      # Staff Google step-up MFA (CR-124) — server-only; never PUBLIC_*
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Staff ThaID step-up MFA & linked login (BORA Digital ID) — server-only; never PUBLIC_*
      THAID_OAUTH_CLIENT_ID: ${THAID_OAUTH_CLIENT_ID:-}
      THAID_OAUTH_CLIENT_SECRET: ${THAID_OAUTH_CLIENT_SECRET:-}
      THAID_OAUTH_AUTH_URL: ${THAID_OAUTH_AUTH_URL:-https://imauthsbx.bora.dopa.go.th/api/v2/oauth2/auth/}
      THAID_OAUTH_TOKEN_URL: ${THAID_OAUTH_TOKEN_URL:-https://imauthsbx.bora.dopa.go.th/api/v2/oauth2/token/}
      THAID_OAUTH_REDIRECT_URI: ${THAID_OAUTH_REDIRECT_URI:-${PUBLIC_ORIGIN:-http://localhost}${THAID_OAUTH_CALLBACK_PATH:-/api/v1/auth/oauth/thaid/callback}}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      couchdb:
        condition: service_healthy
      couchdb-init:
        condition: service_completed_successfully
      fastapi:
        condition: service_started
    restart: unless-stopped
