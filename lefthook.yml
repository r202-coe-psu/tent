# Quality gate configuration (frontend + backend + worker)
# Install: pnpm install (root) — runs `lefthook install` via prepare script.

pre-commit:
  parallel: true
  commands:
    frontend-format-lint:
      root: frontend/
      glob: "**/*.{js,ts,svelte,css,json,md}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files} && pnpm exec eslint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    backend-lint-format:
      root: backend/
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    worker-lint-format:
      root: worker/
      glob: "**/*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true

pre-push:
  # Sequential: vitest + pytest in parallel starve RAM and run slower overall.
  # glob is matched relative to `root`; a job is skipped when no pushed file matches.
  # svelte-check (`pnpm check`) and the full `pnpm test` are manual before a PR.
  # Frontend runs only the test files whose import graph reaches a file changed since the
  # merge-base with origin/develop; deleted/renamed files and config/lockfile/setup changes
  # re-run everything (frontend/scripts/test-changed.sh, forceRerunTriggers in vite.config.ts).
  # Vitest keeps its fs module cache.
  parallel: false
  commands:
    worker-test:
      root: worker/
      glob: "**/*.{py,toml,lock}"
      run: uv run pytest tests

    backend-test:
      root: backend/
      glob: "**/*.{py,toml,lock}"
      run: uv run pytest tests

    frontend-test:
      root: frontend/
      glob: "**/*.{ts,js,svelte,json,css,yaml}"
      run: pnpm test:changed
