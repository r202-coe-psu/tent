# Quality gate configuration (frontend + backend + worker)
# Install: pnpm install (root) — runs `lefthook install` via prepare script.

pre-commit:
  parallel: true
  commands:
    frontend-format-lint:
      root: frontend/
      glob: "**/*.{js,ts,svelte,css,json,md}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files} && pnpm exec eslint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    backend-lint-format:
      root: backend/
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    worker-lint-format:
      root: worker/
      glob: "**/*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    frontend-check:
      root: frontend/
      run: pnpm check

    frontend-test:
      root: frontend/
      run: pnpm test

    backend-test:
      root: backend/
      run: uv run pytest tests

    worker-test:
      root: worker/
      run: uv run pytest tests

    # Donation E2E only — NOT the whole `pnpm test:e2e` suite, which is currently red
    # (`e2e/catalog.test.ts` and parts of `e2e/users/` fail on a clean tree) and would
    # block every push. Widen this to `pnpm test:e2e` once those are green.
    #
    # Requires the docker stack up (`docker compose up -d`) AND CORS enabled on
    # CouchDB: `test` mode builds with an empty `PUBLIC_COUCH_PROXY`, so the browser
    # reaches CouchDB cross-origin at :5984 and every catalog read is blocked without
    # it. Nothing in the repo turns CORS on yet — see the note in CONTRIBUTING §6.
    frontend-e2e-donations:
      root: frontend/
      run: pnpm test:e2e:donations
