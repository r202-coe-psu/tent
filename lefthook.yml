# Quality gate configuration (frontend + backend + worker)
# Install: pnpm install (root) — runs `lefthook install` via prepare script.

pre-commit:
  parallel: true
  commands:
    frontend-format-lint:
      root: frontend/
      glob: "**/*.{js,ts,svelte,css,json,md}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files} && pnpm exec eslint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    backend-lint-format:
      root: backend/
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    worker-lint-format:
      root: worker/
      glob: "**/*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true

pre-push:
  # Sequential: svelte-check + vitest + pytest in parallel starve RAM and run slower overall.
  # Fast jobs first so cheap failures surface early.
  # glob is matched relative to `root`; a job is skipped when no pushed file matches.
  parallel: false
  commands:
    worker-test:
      root: worker/
      glob: "**/*.{py,toml,lock}"
      run: uv run pytest tests

    backend-test:
      root: backend/
      glob: "**/*.{py,toml,lock}"
      run: uv run pytest tests

    frontend-check:
      root: frontend/
      glob: "**/*.{ts,js,svelte,json,css,yaml}"
      run: pnpm check

    frontend-test:
      root: frontend/
      glob: "**/*.{ts,js,svelte,json,css,yaml}"
      # Vitest fs cache disabled here: this hook is the only unit-test gate (see frontend/CONTRIBUTING.md §6).
      run: VITEST_NO_FS_CACHE=1 pnpm test
