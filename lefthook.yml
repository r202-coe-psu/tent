# Quality gate configuration (frontend + backend + worker + tests)
# Install: pnpm install (root) — runs `lefthook install` via prepare script.

pre-commit:
  parallel: true
  commands:
    frontend-format-lint:
      root: frontend/
      glob: "**/*.{js,ts,svelte,css,json,md}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files} && pnpm exec eslint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    backend-lint-format:
      root: backend/
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true

    worker-lint-format:
      root: worker/
      glob: "**/*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true

    tests-format:
      root: tests/
      glob: "**/*.{ts,json,md,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  # Sequential: vitest + pytest in parallel starve RAM and run slower overall.
  # Every job's file list is `files:` = scripts/hooks/own-push-files.sh: files changed by this
  # branch's own commits since its last push, minus commits already on origin/develop (so a
  # merge of develop does not re-test develop; conflict-resolved files still count).
  # glob is matched relative to `root`; a job is skipped when no listed file matches.
  # svelte-check (`pnpm check`) and the full `pnpm test` are manual before a PR.
  # Frontend runs only the test files whose import graph reaches a listed file; deleted/renamed
  # files and config/lockfile/setup changes re-run everything (frontend/scripts/test-changed.sh).
  # Vitest keeps its fs module cache.
  parallel: false
  commands:
    worker-test:
      root: worker/
      glob: "**/*.{py,toml,lock}"
      files: sh "$(git rev-parse --show-toplevel)/scripts/hooks/own-push-files.sh"
      run: uv run pytest tests

    backend-test:
      root: backend/
      glob: "**/*.{py,toml,lock}"
      files: sh "$(git rev-parse --show-toplevel)/scripts/hooks/own-push-files.sh"
      run: uv run pytest tests

    frontend-test:
      root: frontend/
      glob: "**/*.{ts,js,svelte,json,css,yaml}"
      files: sh "$(git rev-parse --show-toplevel)/scripts/hooks/own-push-files.sh"
      run: pnpm test:changed

    # tests/ suites need a live CouchDB and app, so the hook only type-checks and checks
    # formatting; run `pnpm test` in tests/ by hand (tests/README.md).
    tests-check:
      root: tests/
      glob: "**/*.{ts,json,md,yaml}"
      files: sh "$(git rev-parse --show-toplevel)/scripts/hooks/own-push-files.sh"
      run: pnpm exec tsc --noEmit && pnpm exec prettier --check .
